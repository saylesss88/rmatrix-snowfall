[package]
name = "r-matrix-snowfall"
description = "A NixOS-themed matrix snowfall screensaver (Fork of rmatrix)"
version = "0.2.8"
edition = "2024"
authors = [
	"Lucas Rooyakkers <lucas.rooyakkers@protonmail.com>",
	"T.Sawyer <saylesss87@proton.me",
]
repository = "https://github.com/saylesss88/rmatrix-snowfall"
readme = "README.md"
keywords = ["rust", "terminal"]
homepage = "https://github.com/saylesss88/rmatrix-snowfall"
license = 'GPL-3.0-or-later'
exclude = [
	"result",
	"docs",
	"demo.gif",
	".github",
	".gitignore",
	"assets/*.png",
]
categories = ["command-line-utilities"]

[[bin]]
name = "rmsf"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29.0", features = ["events"], default-features = false }
rand = { version = "0.10.1", features = ["sys_rng"], default-features = false }
clap = { version = "4.6.1", features = ["derive"] }
terminal_size = "0.4.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
